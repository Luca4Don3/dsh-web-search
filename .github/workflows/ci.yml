name: 离线验证

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安装局部依赖且禁止依赖脚本
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: 严格类型检查
        run: npm run check
      - name: DSH 兼容层与内核离线验证
        run: npm run test:dsh
      - name: 安装 Pi 运行时（Pi 扩展用例需要 jiti 与 typebox）
        run: npm install -g @earendil-works/pi-coding-agent@1.1.0
      - name: 链接 Pi 运行时依赖
        run: |
          PI_PKG="$(npm root -g)/@earendil-works/pi-coding-agent"
          mkdir -p node_modules/@earendil-works
          ln -sfn "$PI_PKG/node_modules/jiti" node_modules/jiti
          ln -sfn "$PI_PKG/node_modules/typebox" node_modules/typebox
          ln -sfn "$PI_PKG" node_modules/@earendil-works/pi-coding-agent
          for p in pi-ai pi-agent-core pi-tui; do
            ln -sfn "$PI_PKG/node_modules/@earendil-works/$p" "node_modules/@earendil-works/$p"
          done
      - name: Pi 搜索与抓取离线验证
        run: npm run test:pi
      - name: 编译产物必须随源码提交且保持一致
        run: npm run check:artifacts
      - name: 验证可打包文件
        run: npm pack --dry-run
